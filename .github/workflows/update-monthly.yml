name: Monthly data update

# Keeps the monitoring products current: rebuilds precipitation and SPI (CHIRPS v3.0),
# evapotranspiration and soil moisture (FAO WaPOR v3), the reservoir monitor (DE Africa
# Waterbodies) and the experimental seasonal outlook (NMME), runs every QA test and the full
# site build, and commits the new data to main only if all of them pass. The deployment
# workflow (which runs the tests again, including the browser tests) is then started.
#
# Products that do not change monthly (soil, stable cropland, water storage, climate
# projections, SPEI) are not rebuilt here.
on:
  schedule:
    - cron: '30 4 14 * *'   # 14th of each month, 04:30 UTC (CHIRPS final and WaPOR are usually out by then)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-monthly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/pipelines/requirements.txt
      - run: pip install -r scripts/pipelines/requirements.txt

      - name: Precipitation (CHIRPS v3.0)
        run: |
          python -u scripts/pipelines/precip/fetch_chirps3.py
          python -u scripts/pipelines/precip/build_precip.py
          python scripts/pipelines/precip/make_record.py
      - name: SPI and regional partitions
        run: |
          python -u scripts/pipelines/spi/build_spi.py
          python -u scripts/pipelines/partition_regional.py
      - name: Evapotranspiration and soil moisture (FAO WaPOR v3)
        run: |
          python -u scripts/pipelines/wapor/fetch_wapor.py --workers 4
          python -u scripts/pipelines/wapor/build_wapor.py
      - name: Reservoir monitor (DE Africa Waterbodies)
        run: python -u scripts/pipelines/reservoirs/build_reservoirs.py --refresh
      - name: Seasonal outlook (NMME, experimental; calibration uses the saved CHIRPS series)
        run: |
          python -u scripts/pipelines/outlook/fetch_nmme.py
          python -u scripts/pipelines/outlook/build_outlook.py
      - name: Catalog records
        run: |
          python scripts/catalog/aeo_product_records.py et-soil-moisture reservoirs seasonal-outlook
          python scripts/catalog/refresh_access.py

      - name: QA tests (Python)
        run: python -m pytest tests/python -q
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: QA tests (JavaScript)
        run: node --test tests/js/*.test.mjs
      - name: Site build (validates manifests, checksums, partitions, links)
        run: npm run build

      - name: Commit and start the deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/aeo/products src/content/datasets
          if git diff --cached --quiet; then echo "No new data."; exit 0; fi
          git commit -m "Monthly data update $(date -u +%Y-%m) [automated]"
          git pull --rebase origin main
          git push origin HEAD:main
          # pushes made with GITHUB_TOKEN do not trigger workflows; start the deployment explicitly
          gh workflow run deploy.yml --ref main
