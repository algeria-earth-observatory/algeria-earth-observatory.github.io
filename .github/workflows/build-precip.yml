name: Build precipitation product

# Downloads CHIRPS v3.0 for Algeria, builds the AEO precipitation product,
# runs the QA tests and the full site build, and commits the outputs to the
# chosen branch only if every step passed. Run manually from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to build and commit to
        required: true
        default: platform-v2

permissions:
  contents: write

concurrency:
  group: build-precip
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/pipelines/requirements.txt
      - run: pip install -r scripts/pipelines/requirements.txt
      - name: 1. Retrieve CHIRPS v3.0 monthly (Algeria window)
        run: python -u scripts/pipelines/precip/fetch_chirps3.py
      - name: 2-8. Build product (QC, statistics, exports, manifest)
        run: python -u scripts/pipelines/precip/build_precip.py
      - name: 9. Catalog record from manifest
        run: python scripts/pipelines/precip/make_record.py
      - name: QA tests (Python)
        run: python -m pytest tests/python -q
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: QA tests (JavaScript)
        run: node --test tests/js/*.test.mjs
      - name: Site build (validates manifests, checksums, links)
        run: npm run build
      - name: Keep the source index for provenance
        uses: actions/upload-artifact@v4
        with:
          name: chirps3-source-index
          path: data-work/precip/raw/index.json
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/aeo/products/precipitation src/content/datasets/aeo-dza-precipitation-chirps3.json
          git commit -m "Build Algeria precipitation product (CHIRPS v3.0) v1.0.0 [automated]" || echo "nothing to commit"
          git pull --rebase origin ${{ inputs.ref }}
          git push origin HEAD:${{ inputs.ref }}
