name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  data-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/pipelines/requirements.txt
      - run: pip install -r scripts/pipelines/requirements.txt
      - name: Statistics and product QA tests (Python)
        run: python -m pytest tests/python -q
      - name: Browser statistics parity and regional download tests (JavaScript)
        run: node --test tests/js/*.test.mjs

  build:
    needs: data-qa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Validates every catalog record, builds the static site, and checks internal links.
      - run: npm run build
      - run: npm run check
      # Deploy only if the complete download workflow and accessibility checks pass on the built site.
      - run: npx playwright install --with-deps chromium
      - name: End-to-end download journeys and accessibility (Playwright + axe-core)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
