name: Validate pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate catalog, build site, check internal links
        run: npm run build
      - name: Type and template checks
        run: npm run check

  data-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/pipelines/requirements.txt
      - run: pip install -r scripts/pipelines/requirements.txt
      - name: Statistics and product QA tests (Python)
        run: python -m pytest tests/python -q
      - name: Browser statistics parity tests (JavaScript)
        run: node --test tests/js/*.test.mjs
